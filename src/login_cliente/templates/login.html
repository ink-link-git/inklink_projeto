<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cliente - InkLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Mesmo visual da área do tatuador + complementos do cliente -->
    <link rel="stylesheet" href="{{ url_for('login_tatuador.static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('login_cliente.static', filename='css/auth.css') }}">
</head>
<body>

    <header class="top-header">
        <div class="header-buttons">
            <a href="{{ url_for('login_cliente.selecionar_perfil') }}" class="btn-outline">← PERFIS</a>
        </div>
    </header>

    <main class="login-container">

        <div class="brand">
            <span class="brand-box">IL</span>
            <span class="brand-text">INKLINK</span>
        </div>

        <span class="subtitle">ÁREA DO CLIENTE</span>
        <h1 class="title">Entrar</h1>

        <form id="login-form" class="login-form" novalidate>

            <div class="form-group">
                <label for="email">E-MAIL</label>
                <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email">
                <span class="field-error" id="err-email">Informe um e-mail válido.</span>
            </div>

            <div class="form-group">
                <label for="senha">SENHA</label>
                <input id="senha" name="senha" type="password" autocomplete="current-password">
                <span class="field-error" id="err-senha">Informe sua senha.</span>
            </div>

            <button class="btn-submit" type="submit" id="submit-btn">Entrar</button>
            <div class="server-error" id="server-error"></div>
        </form>

        <div class="form-footer">
            <p>Não tem conta? <a href="{{ url_for('login_cliente.cadastro_cliente') }}">Cadastre-se</a></p>
        </div>

    </main>

    <script src="{{ url_for('login_cliente.static', filename='js/login.js') }}"></script>
</body>
</html>
