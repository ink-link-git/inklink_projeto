<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Cliente - InkLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Mesmo visual da área do tatuador + complementos do cliente -->
    <link rel="stylesheet" href="{{ url_for('login_tatuador.static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('login_cliente.static', filename='css/auth.css') }}">
</head>
<body>

    <header class="top-header">
        <div class="header-buttons">
            <a href="{{ url_for('login_cliente.selecionar_perfil') }}" class="btn-outline">← PERFIS</a>
        </div>
    </header>

    <main class="login-container">

        <div class="brand">
            <span class="brand-box">IL</span>
            <span class="brand-text">INKLINK</span>
        </div>

        <span class="subtitle">ÁREA DO CLIENTE</span>
        <h1 class="title">Criar conta</h1>

        <form id="signup-form" class="login-form" novalidate data-login-url="{{ url_for('login_cliente.login_cliente') }}">

            <div class="form-group">
                <label for="nome">NOME COMPLETO</label>
                <input id="nome" name="nome" type="text" placeholder="Lucas Mendes" autocomplete="name">
                <span class="field-error" id="err-nome">Informe seu nome completo.</span>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input id="cpf" name="cpf" type="text" placeholder="123.456.789-00" autocomplete="off">
                <span class="field-error" id="err-cpf">Informe um CPF válido.</span>
            </div>

            <div class="form-group">
                <label for="email">E-MAIL</label>
                <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email">
                <span class="field-error" id="err-email">Informe um e-mail válido.</span>
            </div>

            <div class="form-group">
                <label for="telefone">TELEFONE</label>
                <input id="telefone" name="telefone" type="tel" placeholder="(11) 99999-0000" autocomplete="tel">
                <span class="field-error" id="err-telefone">Informe um telefone válido.</span>
            </div>

            <div class="form-group">
                <label for="senha">SENHA</label>
                <input id="senha" name="senha" type="password" autocomplete="new-password">
                <div class="strength" id="strength"><span></span><span></span><span></span><span></span></div>
                <span class="field-error" id="err-senha">Mínimo de 8 caracteres.</span>
            </div>

            <div class="form-group">
                <label for="confirmar">CONFIRMAR SENHA</label>
                <input id="confirmar" name="confirmar" type="password" autocomplete="new-password">
                <span class="field-error" id="err-confirmar">As senhas não coincidem.</span>
            </div>

            <button class="btn-submit" type="submit" id="submit-btn">Criar conta</button>
            <div class="server-error" id="server-error"></div>
        </form>

        <div class="form-footer">
            <p>Já tem conta? <a href="{{ url_for('login_cliente.login_cliente') }}">Entrar</a></p>
        </div>

    </main>

    <script src="{{ url_for('login_cliente.static', filename='js/main.js') }}"></script>
</body>
</html>
