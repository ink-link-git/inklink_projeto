<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta</title>
  <!-- Referência para o CSS separado -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <main>
    <p class="eyebrow">Novo aqui?</p>
    <h1>Criar conta</h1>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" placeholder="Lucas Mendes" autocomplete="name">
        <div class="field-error" id="err-nome">Informe seu nome completo.</div>
      </div>

      <div class="field">
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" type="text" placeholder="123.456.789-00" autocomplete="off">
        <div class="field-error" id="err-cpf">Informe um CPF válido.</div>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email">
        <div class="field-error" id="err-email">Informe um e-mail válido.</div>
      </div>

      <div class="field">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" placeholder="(11) 99999-0000" autocomplete="tel">
        <div class="field-error" id="err-telefone">Informe um telefone válido.</div>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="••••••••" autocomplete="new-password">
        <div class="strength" id="strength">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="field-error" id="err-senha">Mínimo de 8 caracteres.</div>
      </div>

      <div class="field">
        <label for="confirmar">Confirmar senha</label>
        <input id="confirmar" name="confirmar" type="password" placeholder="••••••••" autocomplete="new-password">
        <div class="field-error" id="err-confirmar">As senhas não coincidem.</div>
      </div>

      <button class="submit" type="submit" id="submit-btn">Criar conta</button>
      <div class="server-error" id="server-error"></div>
    </form>

    <p class="foot">Já tem conta? <a href="#">Entrar</a></p>
  </main>

  <!-- Referência para o JavaScript separado -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
